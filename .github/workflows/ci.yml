name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 20 is the Vercel runtime; 22 covers the top of the engines range.
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No install step: the repo has no dependencies and no lockfile, and the
      # tests run on the Node built-in test runner.
      - run: npm test
